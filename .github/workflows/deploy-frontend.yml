# Frontend (Vite) -> S3 + CloudFront
#
# - Pull request a main : solo compila, para verificar que no se rompe nada.
# - Push a main         : compila y publica en S3.
#
# Configuracion unica (GitHub > Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN    ARN del rol de IAM que GitHub puede asumir (OIDC, sin claves)
#   AWS_REGION      region del bucket, ej. us-east-2
#   S3_BUCKET       nombre del bucket del frontend
#   VITE_BASE_URL   URL de la API Django (queda visible en el navegador: sin secretos)
#   CLOUDFRONT_ID   (opcional) id de la distribucion, para invalidar la cache
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "inmobiliaria-vite/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "inmobiliaria-vite/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necesario para autenticarse en AWS con OIDC

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: inmobiliaria-vite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inmobiliaria-vite/package-lock.json

      - run: npm ci

      # Monta todas las pantallas con datos simulados: si un cambio rompe una, no se publica.
      - run: npm test

      - run: npm run build
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}

      # --- A partir de aqui solo en push a main (no en pull requests) ---
      - name: Credenciales de AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 3

      # Cache segun el tipo de archivo. Vite pone un hash en lo que genera (assets/index-AbC123.js): si el
      # contenido cambia, cambia el nombre, asi que se puede cachear un ano. Lo que viene de public/
      # (images/, favicon, assets/css/main2.css) conserva su nombre: solo 1 hora, para ver los cambios.
      # Sin --delete a proposito: si el bucket guarda algo mas que el frontend, un sync con --delete lo borraria.
      - name: Subir archivos con hash (cache de 1 ano)
        if: github.event_name != 'pull_request'
        run: >
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/"
          --exclude "*/*"
          --cache-control "public,max-age=31536000,immutable"

      - name: Subir archivos sin hash (cache de 1 hora)
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" \
            --exclude index.html --exclude "assets/*" \
            --cache-control "public,max-age=3600"
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --exclude "*" --include "*/*" \
            --cache-control "public,max-age=3600"

      - name: Subir index.html (sin cache, para que los cambios se vean al instante)
        if: github.event_name != 'pull_request'
        run: >
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html"
          --cache-control "no-cache"

      - name: Invalidar cache de CloudFront
        if: github.event_name != 'pull_request' && vars.CLOUDFRONT_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_ID }}" --paths "/*"
